[project]
name = "signal-engine"
version = "0.1.0"
description = "R&D engine for ICP-conditioned manufacturing signal sequences and contact timing"
readme = "README.md"
authors = [
    { name = "Clarissa" }
]
requires-python = ">=3.13"
dependencies = [
    "duckdb>=1.5.5",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "lightgbm>=4.7.0",
    "numpy>=2.5.2",
    "orjson>=3.12.0",
    "polars>=1.44.1",
    "pydantic-settings>=2.15.0",
    "pyyaml>=6.0.3",
    "scikit-learn>=1.9.0",
    "typer>=0.27.2",
    "uvicorn[standard]>=0.52.4",
]

[project.scripts]
signal-engine = "signal_engine:main"

[project.optional-dependencies]
llm = [
    "openai>=3.5.0",
]
tabpfn = [
    "tabpfn>=8.5.0",
]
remote = [
    "paramiko>=3.5",
]
baselines = [
    "catboost>=1.2.8",
    "xgboost>=2.1",
]

[build-system]
requires = ["uv_build>=0.9.5,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.5",
    "types-paramiko>=5.0.0.20260724",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.13"
strict = true
packages = ["signal_engine"]

[[tool.mypy.overrides]]
module = ["yaml", "sklearn.*", "tabpfn.*", "xgboost.*", "catboost.*", "lightgbm.*"]
ignore_missing_imports = true
