schema_version: 1
signal_type: osha_injury_summary
version: 1
description: Annual establishment-level OSHA injury and illness summary.
shape: numeric_series
source_ids: [osha_ita]
durable: true
identity_fields: [establishment_name, establishment_id, naics_code, state]
material_kinds: [annual_report, revised]
numeric_features:
  - field: total_recordable_cases
    unit: cases
    reducers: [latest, max, mean, delta, slope]
  - field: days_away_cases
    unit: cases
    reducers: [latest, max, delta]
  - field: average_annual_employees
    unit: employees
    reducers: [latest, max, delta, slope]
default_half_life_days: 365
applicability_naics_prefixes: ["31", "32", "33"]
